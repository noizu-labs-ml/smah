[package]
name = "smah-core"
version = "0.0.0"
description = "SMAH domain core: settings, runner, parser, db, console, checks — UI-agnostic."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
home = { workspace = true }
# Virtual-postgres store (ticket #24): embedded SQLite read-only behind the
# PG-wire subset; digest markers for the virtual-tool caches.
rusqlite = { workspace = true, features = ["column_decltype"] }
# Local-time log-file names (`smah.<YYYYmmdd_HHMMSS>.log`)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Virtual-tools wave-2 drivers (soap #22, grpc #21): loopback servers +
# interface-first contracts. The big versions are pre-added at the workspace
# root (lanes never edit that file); `tonic-reflection`/`quick-xml` are
# crate-local and wave-2-owned lines.
tokio = { workspace = true, features = ["signal"] }
axum = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
protox = { workspace = true }
quick-xml = "0.38"
# The virtual-tools driver family presents through these leaf crates (the
# frozen `--emulate` dispatch reaches tui/web/api via smah-core, so the
# dependency direction is core -> presentation; see each crate's Cargo.toml).
smah-tui = { path = "../smah-tui" }
smah-vtool-http = { path = "../smah-vtool-http" }
# Contract-freeze sha pins (shared with the #17 transcript cache at the root);
# tool.sha256 staleness markers for the virtual-tools contract caches (#20/#19).
sha2 = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
# Env-gated real-qwen e2e (`#[ignore]`, never in CI): a tiny test-only
# OpenAI-compatible chat client against ALIBABA_BASE_URL.
reqwest = { workspace = true }
# Integration tests drive the grpc driver with a tonic client; the path
# argument is an `http::uri::PathAndQuery` (same 1.x crate tonic uses).
http = "1"
# Real-model e2e tests only (env-gated, `#[ignore]`, never in CI):
# builds an AlibabaProvider backend without runtime coupling.
smah-providers = { path = "../smah-providers" }
