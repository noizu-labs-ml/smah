[package]
name = "smah-cli"
version = "0.0.0"
description = "SMAH CLI: clap command tree, dispatch, and the smah/smah-db binaries."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
smah-core = { path = "../smah-core" }
smah-providers = { path = "../smah-providers" }
smah-tui = { path = "../smah-tui" }
clap = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
# hook-snippet timestamps (local time with offset, repo convention)
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
# tokio::test for wiremock servers (providers own their runtimes; the CLI itself is blocking)
tokio = { workspace = true }
wiremock = { workspace = true }
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
predicates = { workspace = true }

[[bin]]
name = "smah"
path = "src/main.rs"
