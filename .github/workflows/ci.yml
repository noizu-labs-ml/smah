name: CI

on:
  pull_request:
  push:
    branches: [develop, stage, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run python -m pytest tests/ -q

      - name: Assert no shell-execution paths
        run: |
          if grep -rnE "subprocess|shell=True|os\.system|\beval\(|\bexec\(" smah/ \
               --include="*.py" | grep -v "operating_system/info/" | grep -v "There is no eval"; then
            echo "::error::A shell-execution or eval primitive reappeared in smah/. SMAH is print-only."
            exit 1
          fi
          echo "OK: no shell-execution or eval primitives outside OS-info readers."
