name: Rust CI

# Rust-tree gates for the TUI rewrite (runs alongside the Python ci.yml
# until cutover, milestone M9). Print-only invariant: the Rust tree must
# never grow a process-execution primitive.

on:
  pull_request:
  push:
    branches: [develop, stage, main, epic.rust-tui]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo test --workspace

  no-shell-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - name: No shell execution (print-only invariant; smah-run exempt)
        run: |
          # SW-05 (owner decision 2026-11-09): the single source of truth is
          # scripts/no-shell-gate.sh — every crate stays gated except the
          # companion executor crates/smah-run/src (exact path). The
          # pattern itself is unchanged (any Command::new, any
          # process::Command, any spawn path; exit/ExitCode stay legal).
          sh scripts/no-shell-gate.sh .
          echo "OK: no shell-execution primitives outside crates/smah-run/src."
      - name: Gate self-test (gated fails, smah-run passes, lookalike fails)
        run: |
          # Positive controls, both directions: the canonical offender under
          # a GATED crate must FAIL the gate; the same offender under
          # crates/smah-run/src must PASS; a lookalike crate name
          # (smah-runner) must FAIL — the exemption is scoped to the exact
          # path, not a substring. Never compiled — grep fixtures only.
          cat > /tmp/offender.rs <<'EOF'
          use std::process::Command;
          fn main() {
              let _c = std::process::Command::new("ls");
              let mut child = Command::new("ls").spawn().expect("spawn");
              child.wait().expect("wait");
          }
          // each gate term must keep matching its own path token:
          // process::Command — the import/type path
          // process::spawn — the spawn-call path
          let _term3 = process::spawn;
          EOF
          mkdir -p /tmp/gw-gated/crates/smah-core/src /tmp/gw-runner/crates/smah-run/src /tmp/gw-lookalike/crates/smah-runner/src
          cp /tmp/offender.rs /tmp/gw-gated/crates/smah-core/src/lib.rs
          cp /tmp/offender.rs /tmp/gw-runner/crates/smah-run/src/main.rs
          cp /tmp/offender.rs /tmp/gw-lookalike/crates/smah-runner/src/lib.rs
          if sh scripts/no-shell-gate.sh /tmp/gw-gated; then
            echo "::error::self-test: a gated crate with the canonical offender passed the gate."
            exit 1
          fi
          if ! sh scripts/no-shell-gate.sh /tmp/gw-runner; then
            echo "::error::self-test: the crates/smah-run/src exemption is broken."
            exit 1
          fi
          if sh scripts/no-shell-gate.sh /tmp/gw-lookalike; then
            echo "::error::self-test: a lookalike crate name inherited the exemption."
            exit 1
          fi
          if ! grep -qE 'Command::new' /tmp/offender.rs || ! grep -qE 'process::Command' /tmp/offender.rs || ! grep -qE 'process::spawn' /tmp/offender.rs; then
            echo "::error::no-shell-gate pattern failed its self-test: an execution primitive escaped the match."
            exit 1
          fi
          echo "OK: self-test — gated crate fails, smah-run passes, lookalike fails, all three terms still match."
