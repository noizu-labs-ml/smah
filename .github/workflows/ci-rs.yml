name: Rust CI

# Rust-tree gates for the TUI rewrite (runs alongside the Python ci.yml
# until cutover, milestone M9). Print-only invariant: the Rust tree must
# never grow a process-execution primitive.

on:
  pull_request:
  push:
    branches: [develop, stage, main, epic.rust-tui]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo fmt --check

  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable (SHA-pinned)
      - uses: Swatinem/rust-cache@8cbdedb5103daa674dcf46d3590fe06a76645684 # v2.8.0 (SHA-pinned)
      - run: cargo test --workspace

  no-shell-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0 (SHA-pinned, T-007)
      - name: No shell execution (print-only invariant)
        run: |
          # Execution-primitive ban, narrowed 2026-10-18 (#17): the old
          # 'std::process' term banned even std::process::exit/ExitCode,
          # which the binary edge needs for the six-class exit table
          # (interface-spec §4). The pattern now matches every execution
          # shape — any Command::new, any process::Command import, any
          # spawn call — while allowing termination-only exit/ExitCode.
          if grep -rnE 'Command::new|process::Command|process::spawn' crates/*/src; then
            echo "::error::Process/shell execution primitive found in crates/*/src. SMAH is print-only."
            exit 1
          fi
          echo "OK: no shell-execution primitives in the Rust tree."
      - name: Gate self-test (pattern must still catch execution primitives)
        run: |
          # Positive control: the amended pattern MUST match the canonical
          # offender shapes (and each of its three terms), or the gate is
          # silently weaker than intended. Never compiled — grep fixture only.
          cat > /tmp/offender.rs <<'EOF'
          use std::process::Command;
          fn main() {
              let _c = std::process::Command::new("ls");
              let mut child = Command::new("ls").spawn().expect("spawn");
              child.wait().expect("wait");
          }
          // each gate term must keep matching its own path token:
          // process::Command — the import/type path
          // process::spawn — the spawn-call path
          let _term3 = process::spawn;
          EOF
          if ! grep -qE 'Command::new' /tmp/offender.rs || ! grep -qE 'process::Command' /tmp/offender.rs || ! grep -qE 'process::spawn' /tmp/offender.rs; then
            echo "::error::no-shell-gate pattern failed its self-test: an execution primitive escaped the match."
            exit 1
          fi
          echo "OK: self-test — all three terms still catch the canonical execution shapes."
