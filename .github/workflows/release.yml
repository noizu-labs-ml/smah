name: Release to PyPI

# Publishes on a version tag, e.g. `git tag v0.2.0 && git push origin v0.2.0`.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token or repository secret.
# One-time setup on PyPI: Project `smah` -> Settings -> Publishing -> add a
# GitHub publisher with owner `noizu-labs-ml`, repo `smah`, workflow
# `release.yml`, environment `pypi`.
on:
  push:
    tags: ["v*"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry==1.8.4

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests before publishing
        run: poetry run python -m pytest tests/ -q

      - name: Verify tag matches project version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(poetry version --short)"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::Tag $TAG does not match pyproject version $VER"
            exit 1
          fi
          echo "Tag matches version: $VER"

      - name: Build
        run: poetry build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
