[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/noizu-labs-ml/smah"

[workspace.dependencies]
# Async runtime (rt-multi-thread/macros/sync/time per plan §B)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
# CLI (clap 4 derive; global flags, hidden aliases, ArgAction::Count for -v)
clap = { version = "4", features = ["derive"] }
# TUI
ratatui = "0.30"
crossterm = "0.29"
# HTTP — rustls only; both provider clients are hand-rolled on top (plan §B)
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream"] }
# Stream combinators for consuming reqwest's bytes_stream (SSE); std-only slice
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Serialization — preserve_order + Value-centric YAML for Python-format parity
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
# Storage — bundled sqlite; bespoke checksummed migration runner stays byte-exact
rusqlite = { version = "0.40", features = ["bundled"] }
# System info without subprocess (print-only invariant: zero process::Command)
sysinfo = "0.39"
# Clipboard — degrade-to-hint on failure (headless/Wayland-safe); feature-gated at the use site
arboard = "3"
# Errors
thiserror = "2"
# Markdown → styled Text
pulldown-cmark = "0.13"
# MD5 checksum parity with the Python-era migration runner
md-5 = "0.11"
# ~/.smah paths
home = "0.5"
# Logging + redaction writer (T-001 fix)
tracing = "0.1"
tracing-subscriber = "0.3"
# Dev/test
wiremock = "0.6"
assert_cmd = "2"
insta = "1"
tempfile = "3"
predicates = "3"
